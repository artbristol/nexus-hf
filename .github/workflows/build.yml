name: build

# Provisions a machine and runs Maven; everything else is in the POM, and runs the same on a laptop.
on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" builds, tests and releases the version in the POM
  workflow_dispatch:

permissions:
  contents: read

# one run at a time talks to huggingface.co
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: mvn -B verify
        env:
          E2E_HF_TOKEN: ${{ secrets.E2E_HF_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/nexus-repository-huggingface-*[0-9].jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: |
            target/e2e/nexus.out
            target/e2e/sonatype-work/nexus3/log/
          if-no-files-found: ignore

  # releases the jar the build job tested, without building it again
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - run: mvn -B -Pgithub-release initialize exec:exec@github-release
        env:
          GH_TOKEN: ${{ github.token }}
