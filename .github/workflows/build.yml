name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# one run at a time talks to huggingface.co
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # unit tests, then the e2e suite against a Nexus with the plugin and the real Hub
      - name: Build and test
        env:
          # optional: enables the gated-repository test
          E2E_HF_TOKEN: ${{ secrets.E2E_HF_TOKEN }}
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: |
            target/e2e/nexus.out
            target/e2e/sonatype-work/nexus3/log/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/nexus-repository-huggingface-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check tag matches the project version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nexus=$(mvn -B -q help:evaluate -Dexpression=project.parent.version -DforceStdout)
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "${GITHUB_REF_NAME} for Nexus Repository Core ${nexus}" \
            --notes "Built against Nexus Repository Core ${nexus}; install only into that version. See the README for installation."
